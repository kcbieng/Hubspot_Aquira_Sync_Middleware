services:
  db:
    image: postgres:16-alpine
    container_name: aquira-hubspot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquira_hubspot
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware -d aquira_hubspot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquira-hubspot-middleware
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Chicago
      AQUIRA_BASE_URL: ${AQUIRA_BASE_URL:-https://aquira2go.kcbieng.org/Aquira_WebAPI}
      AQUIRA_USERNAME: ${AQUIRA_USERNAME:-}
      AQUIRA_PASSWORD: ${AQUIRA_PASSWORD:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-dev-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql://middleware:middleware_password@db:5432/aquira_hubspot}
      SETTINGS_FERNET_KEY: ${SETTINGS_FERNET_KEY:-dev-change-me}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      WHATIF: ${WHATIF:-true}
      SYNC_CALLS: ${SYNC_CALLS:-false}
      SYNC_CREATE_AQURA_CLIENT: ${SYNC_CREATE_AQURA_CLIENT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOOTSTRAP_HUBSPOT: ${BOOTSTRAP_HUBSPOT:-true}
    volumes:
      - ./logs:/var/log/aquira
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
