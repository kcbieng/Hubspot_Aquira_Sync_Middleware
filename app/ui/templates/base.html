<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aquira HubSpot Middleware</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
      :root {
        --brand-900: #0f172a;
        --brand-700: #1d4ed8;
        --brand-600: #2563eb;
        --brand-100: #dbeafe;
        --ink-700: #334155;
        --ink-500: #64748b;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-soft: #f8fafc;
        --border: rgba(148, 163, 184, 0.28);
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      body {
        background: linear-gradient(180deg, #edf4ff 0%, #f8fafc 100%);
        color: var(--brand-900);
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .app-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 18px 40px;
      }

      .topbar {
        background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 18px 22px;
        margin-bottom: 24px;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        text-decoration: none;
      }

      .brand-mark .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: rgba(255,255,255,0.12);
        display: grid;
        place-items: center;
        font-weight: 700;
      }

      .nav-pills .nav-link {
        color: rgba(255,255,255,0.8);
        border-radius: 999px;
        padding: 0.55rem 0.9rem;
        font-size: 0.92rem;
      }

      .nav-pills .nav-link:hover,
      .nav-pills .nav-link.active {
        background: rgba(255,255,255,0.12);
        color: #fff;
      }

      .panel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .panel-card-soft {
        background: var(--surface-soft);
        border: 1px solid var(--border);
        border-radius: 18px;
      }

      .metric-card {
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
        padding: 1rem 1.15rem;
        height: 100%;
      }

      .metric-label {
        color: var(--ink-500);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .metric-value {
        font-weight: 700;
        font-size: 1.7rem;
        color: var(--brand-900);
      }

      .status-pill {
        display: inline-block;
        padding: 0.42rem 0.8rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .status-pill.ok {
        background: #e8f8ee;
        color: #166534;
      }

      .status-pill.warn {
        background: #fff4d6;
        color: #92400e;
      }

      .btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        border-color: transparent;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 0.9rem;
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <nav class="topbar d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <a href="/ui" class="brand-mark">
          <span class="brand-icon">A</span>
          <span class="fw-bold fs-5">Aquira HubSpot Middleware</span>
        </a>
        <div class="nav-pills d-flex flex-wrap gap-2">
          <a class="nav-link active" href="/ui">Dashboard</a>
          <a class="nav-link" href="/ui/settings">Settings</a>
          <a class="nav-link" href="/ui/owners">Sales reps</a>
          <a class="nav-link" href="/ui/teams">Teams</a>
          <a class="nav-link" href="/ui/runs">Runs</a>
          <a class="nav-link" href="/ui/logs">Logs</a>
        </div>
      </nav>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
