<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aquira HubSpot Middleware</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
      body {
        background: linear-gradient(180deg, #f8f9fb 0%, #eef3ff 100%);
        min-height: 100vh;
      }
      .app-shell {
        max-width: 1100px;
        margin: 48px auto;
        padding: 0 16px;
      }
      .panel-card {
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      .status-pill {
        display: inline-block;
        padding: 0.42rem 0.75rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .status-pill.ok {
        background: #e8f8ee;
        color: #166534;
      }
      .status-pill.warn {
        background: #fff4d6;
        color: #92400e;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.75rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Aquira HubSpot Middleware</h1>
        <span class="status-pill ok">Operational</span>
      </div>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
